<!-- Exercise 2: Product Inventory Management
Create an inventory system.      
const products = [{ id: 1, name: "Laptop", stock: 10, price: 50000 }, { id: 2, name: "Mouse", stock: 50, price: 500 },
                { id: 3, name: "Keyboard", stock: 30, price: 1500 }];
Add a new product using push(). Remove the last product using pop(). Increase the stock of the Laptop by 5. 
Display products whose stock is less than 20. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const products = [
            { id: 1, name: "Laptop", stock: 10, price: 50000 },
            { id: 2, name: "Mouse", stock: 50, price: 500 },
            { id: 3, name: "Keyboard", stock: 30, price: 1500 }
        ];

        products.push({ id: 4, name: "Monitor", stock: 15, price: 12000 });

        document.write("<br>After Adding Product:");
        products.forEach(product => {
            document.write(`${product.name} - Stock: ${product.stock}<br>`);
        });


        products.pop();

        document.write("<br>After Removing Last Product:");
        products.forEach(product => {
            document.write(`${product.name} - Stock: ${product.stock}<br>`);
        });


        products.forEach(product => {
            if (product.name === "Laptop") {
                product.stock += 5;
            }
        });

        document.write("<br>After Increasing Laptop Stock:");
        products.forEach(product => {
            document.write(`${product.name} - Stock: ${product.stock}<br>`);
        });

        
        let lowStock = products.filter(product => product.stock < 20);

        document.write("<br>Products with Stock Less Than 20:");
        lowStock.forEach(product => {
            document.write(`${product.name} - Stock: ${product.stock}<br>`);
        });
    </script>
</body>
</html>
