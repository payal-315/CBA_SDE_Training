<!-- Exercise 3: Even or Odd Using Ternary Operator
Write a program that: Stores a number in a variable. Uses the to determine whether the number is even or odd. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num=15;
        let ans=(num%2==0)?"Even":"odd";
        document.write(ans)
    </script>
</body>
</html>
