<!-- Exercise 1: Number Type Conversion
Create a program that: Stores "250" in a variable. Converts it to a number. Adds 50 to it. Prints the result. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a=250;
        document.write("number: "+a);
        document.write("<br>result: ")
        document.write(Number(a)+50);

    </script>
</body>
</html>
