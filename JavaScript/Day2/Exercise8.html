<!-- Exercise 8: Find First Number Divisible by Both 7 and 9
Use a loop to find the first number between 1 and 500 that is divisible by both 7 and 9. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i=1; i<=500;i++){
            if(i%7==0 && i%9==0){
                document.write(i)
                break;
            }
            
        }

    </script>
</body>
</html>
