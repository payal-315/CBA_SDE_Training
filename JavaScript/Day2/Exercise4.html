<!-- Exercise 4: Multiplication Table
Write a program that: Accepts a number. Uses a to print its multiplication table up to 10. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let number = parseInt(prompt("FOR EXERCISE 4......enter a number: "));

        for(let i=1;i<=10;i++){
            document.write("<br>")
            document.write(number+"x"+i+"="+(number*i))
        }
    </script>
</body>
</html>
