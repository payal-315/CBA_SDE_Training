<!-- Exercise 9: Skip Multiples of 3
Print numbers from 1 to 30 but skip numbers divisible by 3 using . -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let i=0;i<=30;i++){
            if(i%3==0){
                continue;
            }
            document.write("<br>")
            document.write(i);
            
        }

    </script>
</body>
</html>
