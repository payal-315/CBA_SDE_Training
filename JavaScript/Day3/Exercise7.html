<!-- Exercise 7: Function Returning Array
Write a function getEvenNumbers(arr) that returns a new array containing only even numbers. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function getEvenNumbers(arr){
            let even = [];
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] % 2 === 0) {
                    even.push(arr[i]);
                }
            }
            document.write("["+even+"]");
        }
        getEvenNumbers([3, 8, 11, 14, 20])
    </script>
</body>
</html>
