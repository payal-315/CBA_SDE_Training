<!-- Exercise 2: Stop at First Negative
Given: const numbers = [10, 25, 18, -4, 30, 50]; 
stop printing numbers as soon as a negative number is encountered using break. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const numbers=[10,25,18,-4,30,50];
        for(let i=0;i<numbers.length;i++){
            if(numbers[i]<0){
                break;
            }
            document.write(numbers[i]+"<br>")
        }
    </script>
</body>
</html>
