<!-- Exercise 10: Square Every Number
Using map(), create a new array containing the squares of: [2,4,6,8]
Expected Output: [4,16,36,64] -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let number=[2,4,5,8]
        let squares = number.map(num => num * num);
        document.write("<br>["+squares+"]")
    </script>
</body>
</html>
