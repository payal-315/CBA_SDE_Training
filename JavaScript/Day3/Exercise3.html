<!-- Exercise 3: Create a function findMax(a, b) that returns the larger number. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function findMax(a,b){
            document.write( (a>b)?a:b)
        }
        findMax(12,9);
    </script>
</body>
</html>
