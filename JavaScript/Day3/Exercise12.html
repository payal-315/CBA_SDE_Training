<!-- Exercise 12: Employee Salary Report (Combined Challenge)
Given: const employees = [{ name: "Amit", salary: 30000 },{ name: "Neha", salary: 45000 },{ name: "Raj", salary: 28000 },
      { name: "Priya", salary: 50000 }];
Perform the following: Use for...of to print employee names. Create a new array of salaries increased by using map().
Write a function getHighestSalary() that returns the highest salary. Print the updated salary array and the highest salary. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const employees = [
            { name: "Amit", salary: 30000 },
            { name: "Neha", salary: 45000 },
            { name: "Raj", salary: 28000 },
            { name: "Priya", salary: 50000 }
        ];

        document.write("Employee Names:");
        for (const emp of employees) {
            document.write("<br>"+emp.name);
        }

        const NewSalaries = employees.map(emp => emp.salary * 2);


        function getHighestSalary(arr) {
            let highest = arr[0].salary;

            for (const emp of arr) {
                if (emp.salary > highest) {
                    highest = emp.salary;
                }
            }

            return highest
        }


        document.write("<br>New Salaries: [ "+NewSalaries+" ]");
        document.write("<br>Highest Salary:"+getHighestSalary(employees));

    </script>
</body>
</html>
