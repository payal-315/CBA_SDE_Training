<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MCQ Quiz</title>
<style>
body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:linear-gradient(135deg,#74ebd5,#ACB6E5);
}


.main-container{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:60px;
    min-height:100vh;
}


.progress-box{
    width:260px;
    text-align:center;
}

.progress-box h2{
    margin-bottom:20px;
}


.card{
    width:500px;
    background:rgb(241, 237, 200);
    border-radius:15px;
    padding:25px;
    box-shadow:0 10px 25px rgba(173, 132, 132, 0.2);
}

#count{
    color:rgb(192, 13, 13);
    margin-bottom:10px;
    font-weight: 500;
    font-size: larger;
}

#question{
    margin-bottom:20px;
}


.option{
    display:block;
    background:#b0e6f3;
    padding:12px;
    border-radius:8px;
    margin:10px 0;
    cursor:pointer;
    transition:.3s;
}

.option:hover{
    background:#47cf11;
}


button{
    margin-top:20px;
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#007BFF;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0056b3;
}

.nav-buttons{
    display:flex;
    gap:10px;
}

.nav-buttons button{
    width:50%;
    margin-top:0;
}


.gauge{
    width:220px;
    height:220px;
    margin:auto;
}

.gauge-body{
    width:220px;
    height:220px;
    position:relative;
    margin:auto;
}


.gauge-fill{
    position:absolute;
    inset:0;
    border-radius:50%;
    background: conic-gradient(#4CAF50 calc(var(--p) * 1%), #E8E8E8 0);

    transition: 0.5s;
}

.gauge-body::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border: 10px solid #E8E8E8;
    box-sizing:border-box;
    pointer-events:none;
}

.gauge-cover{
    position:absolute;
    width:160px;
    height:160px;
    background:white;
    border-radius:50%;
    top:30px;
    left:30px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:28px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="main-container">

    
    <div class="progress-box">

        <h2>Quiz Progress</h2>

        <div class="gauge">
            <div class="gauge-body">
                <div class="gauge-fill" id="gaugeFill"></div>

                <div class="gauge-cover">
                    <span id="percent">0%</span>
                </div>
            </div>
        </div>

        <p>
            <span id="attempted">0</span> /
            <span id="total">0</span> Attempted
        </p>

    </div>

    
<div class="card" id="quizCard">

        <div id="count"></div>

        <div id="timerBox">
            <span id="timerLabel">Time Left:</span>
            <span id="timer">0:00</span>
        </div>

        <h2 id="question"></h2>

        <div id="options"></div>

        <div class="nav-buttons">
            <button type="button" onclick="prevQuestion()">Previous</button>
            <button type="button" onclick="nextQuestion()">Next</button>
        </div>

    </div>

    <div class="card" id="resultCard" style="display:none;">
        <h2 style="text-align:center;">🎉 Quiz Completed!</h2>
        
            <button type="button" onclick="restartQuiz()">Restart</button>
        </div>
    </div>

</div>

<script>


const questions = [
    {
        question: "Which tag is used to create a hyperlink?",
        options: ["a", "link", "href", "url"],
        correctIndex: 0
    },
    {
        question: "Which CSS property changes text color?",
        options: ["font-color", "color", "text-color", "background-color"],
        correctIndex: 1
    },
    {
        question: "Which keyword declares a constant variable?",
        options: ["var", "let", "const", "static"],
        correctIndex: 2
    },
    {
        question: "Which HTML tag is used to insert an image?",
        options: ["img", "image", "src", "picture"],
        correctIndex: 0
    },
    {
        question: "Which method adds an element at the end of an array?",
        options: ["push()", "pop()", "shift()", "unshift()"],
        correctIndex: 0
    }
];


questions.sort(() => Math.random() - 0.5);

let index = 0;
let attempted = 0;
let score = 0;


const totalQuizTime = 60;
let timeLeft = totalQuizTime;
let timerId = null;


let selectedAnswers = new Array(questions.length).fill(null);


document.getElementById("total").innerHTML = questions.length;
updateGauge();

startTimer();



function loadQuestion(){

    document.getElementById("count").innerHTML =
    `Question ${index + 1} of ${questions.length}`;

    document.getElementById("question").innerHTML =
    questions[index].question;

    let output = "";

   
    questions[index].options.forEach((option, i) => {
        const checked = selectedAnswers[index] === i ? "checked" : "";
        output += `
        <label class="option">
            <input type="radio" name="answer" ${checked}>
            ${option}
        </label>
        `;
    });

    document.getElementById("options").innerHTML = output;
}

function updateGauge(){

    let percentage = (attempted / questions.length) * 100;

    percentage = Math.max(0, Math.min(100, percentage));

    document.getElementById("percent").innerHTML =
    Math.round(percentage) + "%";

    document.getElementById("attempted").innerHTML =
    attempted;

    document.getElementById("gaugeFill").style.setProperty('--p', percentage);
}

function updateTimerUI(){
    const minutes = Math.floor(timeLeft / 60);
    const seconds = timeLeft % 60;
    document.getElementById("timer").innerHTML = minutes + ":" + (seconds < 10 ? "0" + seconds : seconds);
}

function startTimer(){
    updateTimerUI();
    timerId = setInterval(() => {
        timeLeft--;
        updateTimerUI();

        if(timeLeft <= 0){
            timeLeft = 0;
            updateTimerUI();
            finishQuiz();
        }
    }, 1000);
}

function stopTimer(){
    if(timerId !== null){
        clearInterval(timerId);
        timerId = null;
    }
}

function calculateScore(){
    let s = 0;
    for(let i = 0; i < questions.length; i++){
        if(selectedAnswers[i] !== null){
            if(selectedAnswers[i] === questions[i].correctIndex){
                s++;
            }
        }
    }
    return s;
}

function refreshAttempted(){
    attempted = 0;
    for(let i = 0; i < questions.length; i++){
        if(selectedAnswers[i] !== null){
            attempted++;
        }
    }
    updateGauge();
}

function saveCurrentSelection(){
    let radios = document.querySelectorAll('input[name="answer"]');
    let chosen = null;

    radios.forEach((r, i) => {
        if(r.checked){
            chosen = i;
        }
    });

    
    selectedAnswers[index] = chosen;

   
    refreshAttempted();
}

function nextQuestion(){
    if(document.getElementById("quizCard").style.display === "none") return;

    saveCurrentSelection();
    index++;

    if(index < questions.length){
        loadQuestion();
    } else {
        finishQuiz();
    }
}

function prevQuestion(){
    if(document.getElementById("quizCard").style.display === "none") return;

    
    saveCurrentSelection();
    index--;

    if(index >= 0){
        loadQuestion();
    } else {
        index = 0;
        loadQuestion();
    }
} 

function finishQuiz(){
    stopTimer();

    
    saveCurrentSelection();

    score = calculateScore();
    refreshAttempted();

    document.getElementById("quizCard").style.display = "none";
    document.getElementById("resultCard").style.display = "block";

    document.getElementById("score").innerHTML = score;
    document.getElementById("totalScore").innerHTML = questions.length;
    document.getElementById("attemptedFinal").innerHTML = attempted;
    document.getElementById("totalFinal").innerHTML = questions.length;
}

function restartQuiz(){
    
    stopTimer();
    timeLeft = totalQuizTime;
    index = 0;
    attempted = 0;
    score = 0;
    selectedAnswers = new Array(questions.length).fill(null);

    questions.sort(() => Math.random() - 0.5);

    document.getElementById("resultCard").style.display = "none";
    document.getElementById("quizCard").style.display = "block";

    loadQuestion();
    refreshAttempted();
    startTimer();
}


loadQuestion();
updateGauge();

</script>

</body>
</html>
